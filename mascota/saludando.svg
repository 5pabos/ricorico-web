<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 0 92 98" width="460" height="490" role="img" aria-labelledby="t">
  <title id="t">La mascota de RicoRico, un muslito de pollo con gorro de cocinero, saludando</title>
  <!-- Colores y trazo del icono de la app: contorno #23395B, muslo #E0913F, brillo #F6C27A, hueso y gorro #FFF8E7 -->
  <g stroke="#23395B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Piernas: el hueso; las dos puntas son los pies -->
    <path d="M51,66 L49,80" fill="none" stroke-width="6.4"/>
    <path d="M57,66 L59,80" fill="none" stroke-width="6.4"/>
    <path d="M51,66 L49,80" fill="none" stroke="#FFF8E7" stroke-width="2.4"/>
    <path d="M57,66 L59,80" fill="none" stroke="#FFF8E7" stroke-width="2.4"/>
    <circle cx="48" cy="86" r="5.5" fill="#FFF8E7"/>
    <circle cx="60" cy="86" r="5.5" fill="#FFF8E7"/>
    <!-- Brazo que saluda (arriba, a la derecha) y brazo relajado (a la izquierda) -->
    <path d="M73,42 C81,40 85,34 86,27" fill="none"/>
    <circle cx="86.5" cy="23.5" r="4.6" fill="#FFF8E7"/>
    <path d="M35,44 C29,48 27,54 27,59" fill="none"/>
    <circle cx="27" cy="62" r="4.6" fill="#FFF8E7"/>
    <!-- Cuerpo: el muslo -->
    <path d="M54,18 C72,18 80,32 74,46 C70,56 62,62 58,66 L50,66 C46,62 38,56 34,46 C28,32 36,18 54,18 Z" fill="#E0913F"/>
    <!-- Gorro de cocinero -->
    <path d="M42,19 C37,18 36,10 42,9 C43,3 52,2 54,6 C57,2 65,3 66,9 C72,10 71,18 66,19 Z" fill="#FFF8E7"/>
    <path d="M42,19 L66,19 L65,24 C60,26 48,26 43,24 Z" fill="#FFF8E7"/>
  </g>
  <!-- Brillo suave del muslo -->
  <path d="M39,36 C40,31 44,28 49,27.4" fill="none" stroke="#F6C27A" stroke-width="3" stroke-linecap="round"/>
  <!-- Cara: ojos ovalados con brillo, mejillas y sonrisa de una línea -->
  <ellipse cx="47.5" cy="39" rx="2.3" ry="3.1" fill="#23395B"/>
  <ellipse cx="60.5" cy="39" rx="2.3" ry="3.1" fill="#23395B"/>
  <circle cx="48.2" cy="37.8" r=".8" fill="#fff"/>
  <circle cx="61.2" cy="37.8" r=".8" fill="#fff"/>
  <circle cx="42.5" cy="46" r="3.1" fill="#F4A6A6" opacity=".85"/>
  <circle cx="65.5" cy="46" r="3.1" fill="#F4A6A6" opacity=".85"/>
  <path d="M49.5,47.4 Q54,51.6 58.5,47.4" fill="none" stroke="#23395B" stroke-width="1.7" stroke-linecap="round"/>
  <!-- Rayitas del saludo -->
  <g fill="none" stroke="#23395B" stroke-width="1.5" stroke-linecap="round">
    <path d="M93,20 Q96,23.5 93,27"/>
    <path d="M97,17 Q102,23.5 97,30"/>
  </g>
</svg>
